
<div class="employee-page">
  <div class="employee-card">

    <div class="form-header">
      <div class="header-icon">+</div>
      <div>
        <h2>Add New Employee</h2>
        <p>Fill in the information to register a new employee.</p>
      </div>
    </div>

    <form class="employee-form">

      <div class="section-heading">
        <span class="section-number">01</span>
        <div>
          <h3>Personal Information</h3>
          <p>Basic employee details</p>
        </div>
      </div>

      <div class="form-grid">

        <div class="form-group">
          <label for="fullName">Full Name <span>*</span></label>
          <input type="text" id="fullName"
            name="fullName" placeholder="Enter full name" required>
        </div>

        <div class="form-group">
          <label for="employeeId">Employee ID <span>*</span></label>
          <input type="text" id="employeeId"
            name="employeeId" placeholder="e.g. EMP-001" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address <span>*</span></label>
          <input type="email" id="email"
            name="email" placeholder="name@company.com" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number <span>*</span></label>
          <input type="tel" id="phone"
            name="phone" placeholder="+92 300 1234567" required>
        </div>

        <div class="form-group">
          <label for="gender">Gender</label>
          <select id="gender" name="gender">
            <option value="">Select gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" name="dob">
        </div>

      </div>

      <div class="section-heading">
        <span class="section-number">02</span>
        <div>
          <h3>Employment Details</h3>
          <p>Department and job information</p>
        </div>
      </div>

      <div class="form-grid">

        <div class="form-group">
          <label for="department">Department <span>*</span></label>
          <select id="department" name="department" required>
            <option value="">Select department</option>
            <option value="IT">IT &amp; Development</option>
            <option value="HR">Human Resources</option>
            <option value="Finance">Finance</option>
            <option value="Marketing">Marketing</option>
            <option value="Sales">Sales</option>
            <option value="Operations">Operations</option>
          </select>
        </div>

        <div class="form-group">
          <label for="designation">Designation <span>*</span></label>
          <input type="text" id="designation"
            name="designation" placeholder="e.g. Software Developer" required>
        </div>

        <div class="form-group">
          <label for="joiningDate">Joining Date <span>*</span></label>
          <input type="date" id="joiningDate"
            name="joiningDate" required>
        </div>

        <div class="form-group">
          <label for="salary">Monthly Salary</label>
          <div class="salary-input">
            <span>PKR</span>
            <input type="number" id="salary"
              name="salary" placeholder="Enter salary" min="0">
          </div>
        </div>

        <div class="form-group">
          <label for="employmentType">Employment Type</label>
          <select id="employmentType" name="employmentType">
            <option value="">Select employment type</option>
            <option value="full-time">Full-time</option>
            <option value="part-time">Part-time</option>
            <option value="contract">Contract</option>
            <option value="intern">Intern</option>
          </select>
        </div>

        <div class="form-group">
          <label for="status">Employee Status</label>
          <select id="status" name="status">
            <option value="active">Active</option>
            <option value="probation">Probation</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label for="address">Residential Address</label>
          <textarea id="address" name="address"
            rows="3" placeholder="Enter complete residential address"></textarea>
        </div>

      </div>

      <div class="form-footer">
        <p><span>*</span> Required fields</p>

        <div class="form-buttons">
          <button type="reset" class="btn btn-reset">
            Reset
          </button>
          <button type="submit" class="btn btn-submit">
            Add Employee <span>→</span>
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
