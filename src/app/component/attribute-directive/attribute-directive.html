<div class="container mt-5">
  <div class="demo-card">
    
    <div class="card-header text-center mb-4">
      <h3>Attribute Directive Demo</h3>
      <p class="text-muted">Click the buttons below to change the background color.</p>
    </div>

    <!-- Target Div with dynamic class -->
    <div 
      [ngClass]="div1BgColor" 
      class="color-box d-flex align-items-center justify-content-center rounded shadow-sm text-white">
      <h2 class="m-0 fw-bold">Div 1</h2>
    </div>

    <!-- Buttons -->
    <div class="button-group d-flex gap-3 mt-4 justify-content-center">
      <button class="btn btn-danger px-4" (click)="bgRed()">🔴 Red</button>
      <button class="btn btn-primary px-4" (click)="bgblue()">🔵 Blue</button>
      <button class="btn btn-dark px-4" (click)="toggle()">🔄 Toggle</button>
    </div>

  </div>
</div>
